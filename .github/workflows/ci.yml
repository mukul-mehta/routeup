name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      - name: just test-race
        run: just test-race

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: validate examples
        run: go test ./examples/...

  validation:
    name: repository configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: validate modules, Actions, and JSON artifacts
        run: |
          go mod tidy -diff
          go mod verify
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python3 -m json.tool deploy/grafana-dashboard.json >/dev/null
          python3 -m json.tool routeup.schema.json >/dev/null

  dev-server-integration:
    name: integration (Vite/Next HMR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Vite/Next HMR integration
        run: go test -tags integration -run TestIntegration -timeout 15m ./internal/server

  integration-ubuntu:
    name: integration (ubuntu, :${{ matrix.port }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        port: [443, 47443]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install setcap/getcap
        run: sudo apt-get update && sudo apt-get install -y libcap2-bin

      - name: build
        run: go build -buildvcs=false -o bin/routeup ./cmd/routeup

      # Native execution (real filesystem): both the privileged-bind path (443,
      # setcap on the binary) and the high-port path (47443, no setcap) work.
      - name: integration
        run: bash scripts/integration-linux.sh ./bin/routeup ${{ matrix.port }}

  integration-fedora:
    name: integration (fedora, :${{ matrix.port }})
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        port: [443, 47443]
    steps:
      - name: install deps
        run: dnf install -y git golang libcap ca-certificates sudo python3 curl shadow-utils

      - uses: actions/checkout@v6

      - name: build
        run: go build -buildvcs=false -o bin/routeup ./cmd/routeup

      - name: create unprivileged test user
        run: |
          useradd --create-home routeup-ci
          printf 'routeup-ci ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/routeup-ci
          chmod 0440 /etc/sudoers.d/routeup-ci
          chown -R routeup-ci:routeup-ci "$GITHUB_WORKSPACE"

      # Fedora only exists here as a container, so :443 stresses setcap on an
      # overlay filesystem (may reject the security.capability xattr); :47443
      # skips setcap. fail-fast:false keeps the cells independent so a setcap
      # limitation surfaces on its own.
      - name: integration
        run: sudo -u routeup-ci -H bash scripts/integration-linux.sh ./bin/routeup ${{ matrix.port }}

  integration-macos:
    name: integration (macOS smoke)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -buildvcs=false -o bin/routeup ./cmd/routeup

      - name: smoke
        run: bash scripts/integration-macos.sh ./bin/routeup
