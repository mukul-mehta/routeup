name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: require successful CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$release_sha" origin/main
          green_runs=$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$release_sha" \
            -f event=push \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length')
          if [[ "$green_runs" -lt 1 ]]; then
            printf 'no successful main CI run found for release commit %s\n' "$release_sha" >&2
            exit 1
          fi

      - name: validate release tag and repository
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          : "${HOMEBREW_TAP_TOKEN:?Set the HOMEBREW_TAP_TOKEN repository secret}"
          go mod tidy -diff
          go mod verify
          go test ./...
          sh -n install.sh

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: validate GoReleaser configuration
        run: goreleaser check

      - name: publish release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
